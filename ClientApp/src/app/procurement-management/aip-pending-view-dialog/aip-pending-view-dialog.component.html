 <h2 mat-dialog-title>View AIP Pending Info</h2>
    <mat-dialog-content>
      <p><strong>Equipment Name:</strong> {{ data.equpmentName }}</p>
      <p><strong>Ship Name:</strong> {{ data.shipName }}</p>
      <p><strong>Controlled:</strong> {{ data.controlledName }}</p>
      <p><strong>Agency:</strong> {{ data.dgdpNssdName }}</p>
      <p><strong>E-Price:</strong> {{ data.ePrice }}</p>

    <mat-dialog-actions align="end">
      <button mat-button mat-dialog-close>Close</button>
    </mat-dialog-actions>
